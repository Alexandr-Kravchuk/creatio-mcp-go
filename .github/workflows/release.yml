name: Release (Linux and Windows archives)

# Builds the unsigned Linux and Windows archives for an existing DRAFT release and attaches them.
# macOS archives are not built here: they must be signed with the Developer ID certificate and
# notarized with the App Store Connect API key, and both stay on the release owner's machine
# (scripts/build-release.sh reads them from ~/secrets/adac-release.env). See docs/releasing.md.
#
# SHA256SUMS: the workflow downloads the draft's SHA256SUMS (if there is one), replaces the lines of the
# files it uploads, keeps every other line (the macOS archives), and uploads the merged file back.
# Needs no secrets: the job token with contents: write is enough.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pushed tag that has a draft release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-windows:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tag and the draft release
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null || { echo "tag $TAG is not pushed" >&2; exit 1; }
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft) || { echo "no release for $TAG; create a draft first" >&2; exit 1; }
          [[ $is_draft == true ]] || { echo "release $TAG is already published; this workflow only fills drafts" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test the tagged commit
        run: |
          go vet ./...
          go test ./...
      - name: Build archives
        run: UNSIGNED=1 TARGETS="linux/amd64 linux/arm64 windows/amd64" scripts/build-release.sh "$TAG"
      - name: Merge SHA256SUMS with the one already on the draft
        run: |
          existing=$(mktemp -d)
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            gh release download "$TAG" --pattern SHA256SUMS --dir "$existing"
            awk 'NR == FNR { built[$2] = 1; next } !($2 in built)' dist/SHA256SUMS "$existing/SHA256SUMS" > "$existing/kept"
          else
            : > "$existing/kept"
          fi
          sort -k2 dist/SHA256SUMS "$existing/kept" > "$existing/merged"
          mv "$existing/merged" dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Upload to the draft release
        run: gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.zip dist/SHA256SUMS
      - name: Download back and verify
        run: |
          check=$(mktemp -d)
          gh release download "$TAG" --dir "$check" --pattern '*_linux_*' --pattern '*_windows_*' --pattern SHA256SUMS
          diff "$check/SHA256SUMS" dist/SHA256SUMS
          cd "$check" && shasum -a 256 -c SHA256SUMS --ignore-missing
